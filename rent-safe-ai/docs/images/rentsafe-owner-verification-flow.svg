<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="100%" height="100%">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <marker id="arrowhead-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3b82f6"/>
    </marker>
  </defs>
  <rect width="1200" height="520" fill="#f8fafc" rx="8"/>
  
  <text x="600" y="35" font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="22" font-weight="bold" fill="#0f172a" text-anchor="middle">Owner Verification Flow</text>
  
  <!-- Row 1 -->
  <rect x="40" y="60" width="160" height="50" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="120" y="90" font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#1e40af" text-anchor="middle">Owner signs in</text>
  
  <line x1="200" y1="85" x2="240" y2="85" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <rect x="240" y="60" width="160" height="50" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="320" y="90" font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#1e40af" text-anchor="middle">Phone / Email verified</text>
  
  <line x1="400" y1="85" x2="440" y2="85" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <rect x="440" y="60" width="160" height="50" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="520" y="90" font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#1e40af" text-anchor="middle">Owner KYC verified</text>
  
  <!-- Row 2 -->
  <line x1="520" y1="110" x2="520" y2="150" stroke="#64748b" stroke-width="2"/>
  <line x1="520" y1="150" x2="120" y2="150" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <rect x="40" y="150" width="160" height="50" rx="6" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
  <text x="120" y="180" font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#334155" text-anchor="middle">Create Property Claim</text>
  
  <line x1="200" y1="175" x2="240" y2="175" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <rect x="240" y="150" width="160" height="50" rx="6" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
  <text x="320" y="180" font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#334155" text-anchor="middle">Address + legal identifiers</text>
  
  <line x1="400" y1="175" x2="440" y2="175" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <rect x="440" y="150" width="160" height="50" rx="6" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
  <text x="520" y="180" font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#334155" text-anchor="middle">Upload Title / Tax / Ownership Evidence</text>
  
  <!-- Row 3 -->
  <line x1="520" y1="200" x2="520" y2="240" stroke="#64748b" stroke-width="2"/>
  <line x1="520" y1="240" x2="240" y2="240" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <rect x="240" y="240" width="160" height="50" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="320" y="270" font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#92400e" text-anchor="middle">Malware / file integrity scan</text>
  
  <line x1="400" y1="265" x2="440" y2="265" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <rect x="440" y="240" width="160" height="50" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="520" y="270" font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#92400e" text-anchor="middle">AI document intelligence</text>
  
  <line x1="600" y1="265" x2="640" y2="265" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <rect x="640" y="240" width="160" height="50" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="720" y="270" font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#92400e" text-anchor="middle">Authoritative registry lookup</text>
  
  <line x1="800" y1="265" x2="840" y2="265" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <rect x="840" y="240" width="160" height="50" rx="6" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
  <text x="920" y="260" font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#334155" text-anchor="middle">Property exists?</text>
  <text x="920" y="278" font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#334155" text-anchor="middle">Registry owner matches KYC?</text>
  
  <!-- Decision branches -->
  <line x1="920" y1="290" x2="920" y2="330" stroke="#64748b" stroke-width="2"/>
  <text x="940" y="315" font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#dc2626">No → Reject</text>
  
  <line x1="920" y1="330" x2="600" y2="330" stroke="#dc2626" stroke-width="2" marker-end="url(#arrowhead)"/>
  <rect x="420" y="310" width="180" height="40" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="510" y="335" font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#991b1b" text-anchor="middle">Reject + fraud signal</text>
  
  <line x1="920" y1="290" x2="1040" y2="290" stroke="#64748b" stroke-width="2"/>
  <text x="960" y="282" font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#16a34a">Yes</text>
  
  <line x1="1040" y1="290" x2="1040" y2="360" stroke="#16a34a" stroke-width="2" marker-end="url(#arrowhead-blue)"/>
  <rect x="940" y="360" width="200" height="50" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="1040" y="383" font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#166534" text-anchor="middle">Presence proof / reviewer checks</text>
  <text x="1040" y="400" font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#166534" text-anchor="middle">Property ACTIVE</text>
  
  <!-- Final steps -->
  <line x1="1040" y1="410" x2="1040" y2="450" stroke="#16a34a" stroke-width="2" marker-end="url(#arrowhead-blue)"/>
  <rect x="940" y="450" width="200" height="50" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="1040" y="473" font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#1e40af" text-anchor="middle">Listing creation enabled</text>
  <text x="1040" y="490" font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#1e40af" text-anchor="middle">Listing review</text>
  
  <line x1="1040" y1="500" x2="1040" y2="510" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrowhead-blue)"/>
  <rect x="940" y="510" width="200" height="0" rx="6" fill="none" stroke="#3b82f6" stroke-width="2"/>
</svg>