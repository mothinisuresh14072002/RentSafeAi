version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.3-alpine
    container_name: rent_safe_db
    environment:
      POSTGRES_USER: rentsafe
      POSTGRES_PASSWORD: rentsafe_password
      POSTGRES_DB: rentsafe
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
