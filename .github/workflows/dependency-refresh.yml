name: Dependency Refresh

on:
  push:
    branches: ["production-hardening-2026-10-06"]
    paths:
      - ".github/workflows/dependency-refresh.yml"

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: rent-safe-ai
    steps:
      - uses: actions/checkout@v4
        with:
          ref: production-hardening-2026-10-06
      - uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: rent-safe-ai/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Patch deployable direct dependencies
        run: |
          pnpm --filter web update next@^16.3.6 eslint-config-next@^16.3.6
          pnpm --filter api update compression@^1.8.2
      - name: Refresh compatible transitive dependencies
        run: pnpm --filter api... --filter web... update --depth Infinity
      - name: Commit dependency refresh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/package.json apps/api/package.json pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "No dependency changes were needed."
            exit 0
          fi
          git commit -m "fix(deps): patch deployable runtime vulnerabilities"
          git push origin HEAD:production-hardening-2026-10-06
