name: Container Release

on:
  workflow_run:
    workflows: ["RentSafe AI CI"]
    branches: ["main"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish API and Web images
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Checkout verified revision
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API
        uses: docker/build-push-action@v6
        with:
          context: ./rent-safe-ai
          file: ./rent-safe-ai/apps/api/Dockerfile
          push: true
          cache-from: type=gha,scope=rentsafe-api
          cache-to: type=gha,mode=max,scope=rentsafe-api
          tags: |
            ghcr.io/mothinisuresh14072002/rentsafeai-api:latest
            ghcr.io/mothinisuresh14072002/rentsafeai-api:${{ env.RELEASE_SHA }}

      - name: Build and push Web
        uses: docker/build-push-action@v6
        with:
          context: ./rent-safe-ai
          file: ./rent-safe-ai/apps/web/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=/api/v1
          cache-from: type=gha,scope=rentsafe-web
          cache-to: type=gha,mode=max,scope=rentsafe-web
          tags: |
            ghcr.io/mothinisuresh14072002/rentsafeai-web:latest
            ghcr.io/mothinisuresh14072002/rentsafeai-web:${{ env.RELEASE_SHA }}
